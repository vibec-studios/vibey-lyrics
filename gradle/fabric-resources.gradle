// Shared by both Fabric build scripts.
base { archivesName = "${project.archives_base_name}-fabric-${project.minecraft_label}" }

def mcVersion = project.minecraft_version

processResources {
    // Fog color and clouds for the custom skies everywhere; 1.21.9/1.21.10 also lack Fabric's world render events,
    // there a small mixin takes their place.
    def mixins = '"mixins": ["vibeylyrics.mixins.json"],'
    def mixinClasses = ['"FogMixin"', '"CloudMixin"', '"SkyMixin"']
    if (mcVersion == '1.21.9') mixinClasses << '"LevelRendererMixin"'
    filesMatching('vibeylyrics.mixins.json') { expand(mixin_classes: mixinClasses.join(', ')) }
    def props = [
            version        : project.version,
            mod_id         : project.mod_id,
            mod_name       : project.mod_name,
            minecraft_range: project.minecraft_range,
            loader_version : project.loader_version,
            java           : project.ext.javaVersion,
            mixins         : mixins,
            mixin_classes  : mixinClasses.join(', '),
    ]
    inputs.properties(props)
    filesMatching('fabric.mod.json') { expand props }
}

loom {
    runs {
        client { runDir = 'run' }
        // Dev-only smoke test: quits the game as soon as the title screen is shown and logs it.
        smoke {
            inherit client
            name = 'Smoke Client'
            vmArg '-Dvibeylyrics.smoke=true'
            runDir = 'run'
        }
    }
}

// Client game test: starts the real game, plays the demo song and takes screenshots of every position.
// ./gradlew :fabric-1.21.11:runClientGameTest   (screenshots: versions/<v>/run/clientGameTest/screenshots)
// Fabric's client game test API exists from 1.21.4 on.
if (!(mcVersion in ['1.21.1', '1.21.3'])) {
    fabricApi {
        configureTests {
            createSourceSet = true
            modId = 'vibeylyrics-gametest'
            enableGameTests = false
            enableClientGameTests = true
            eula = true
        }
    }
    sourceSets.named('gametest') {
        java.srcDirs = [rootProject.file('src/gametest/java')]
        resources.srcDirs = [rootProject.file('src/gametest/resources')]
    }
    loom.runs.named('clientGameTest') {
        vmArg '-Dfabric.client.gametest.disableNetworkSynchronizer=true'
        vmArg "-Dvibeylyrics.trailer=${System.getProperty('vibeylyrics.trailer', 'false')}"
        vmArg "-Dvibeylyrics.only=${System.getProperty('vibeylyrics.only', '')}"
    }
}
