version = project.mod_version
group = project.maven_group

java {
    toolchain.languageVersion = JavaLanguageVersion.of(project.ext.javaVersion)
    withSourcesJar()
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(project.ext.javaVersion)
}

// Version string baked into the jar (used for the LRCLIB user agent).
def generatedDir = layout.buildDirectory.dir('generated/vibeylyrics')
def genTask = tasks.register('generateBuildInfo') {
    def ver = project.version.toString()
    inputs.property('version', ver)
    outputs.dir(generatedDir)
    doLast {
        def f = generatedDir.get().file('dev/henny/lyrics/BuildInfo.java').asFile
        f.parentFile.mkdirs()
        f.text = """package dev.henny.lyrics;

/** Generated by gradle/common.gradle. */
public final class BuildInfo {
    public static final String VERSION = "${ver}";
    private BuildInfo() {}
}
"""
    }
}
sourceSets.main.java.srcDir(generatedDir)
tasks.named('compileJava') { dependsOn genTask }
afterEvaluate {
    tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn genTask }
}

jar {
    from(rootProject.file('LICENSE')) { rename { "LICENSE_vibeylyrics" } }
    // The bundled fonts must travel with their licenses (SIL OFL 1.1 / Apache 2.0).
    from(rootProject.file('licenses')) { into 'licenses/vibeylyrics' }
}
