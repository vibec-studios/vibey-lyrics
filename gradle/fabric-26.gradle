// Fabric, Minecraft 26.x (the game ships unobfuscated, no mappings and no remapping).
plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
}

ext.javaVersion = 25
apply from: rootProject.file('gradle/common.gradle')

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "fr.delthas:javamp3:${project.javamp3_version}"
    include "fr.delthas:javamp3:${project.javamp3_version}"
}

apply from: rootProject.file('gradle/fabric-resources.gradle')
